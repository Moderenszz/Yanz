<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanz - Profile</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Intro Overlay */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b091a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .intro-content {
            text-align: center;
            animation: pulseIntro 1.5s infinite alternate;
        }

        .intro-content h1 {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .intro-content p {
            color: #9ca3af;
            font-size: 0.95rem;
            letter-spacing: 2px;
        }

        @keyframes pulseIntro {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            display: none; /* Ditampilkan setelah intro selesai */
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: space-between;
        }

        /* Navigation Header */
        nav {
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        nav button {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        nav button.active, nav button:hover {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        /* Pages */
        .page {
            display: none;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profile Card */
        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #c084fc;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.5);
        }

        .profile-card h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .profile-card p {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Links List */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .link-info i {
            font-size: 1.4rem;
            width: 25px;
            text-align: center;
        }

        .fa-tiktok { color: #fe2c55; }
        .fa-instagram { color: #e1306c; }
        .fa-gamepad { color: #e53935; }
        .fa-discord { color: #5865F2; }

        .link-item span {
            font-size: 0.95rem;
        }

        .link-item .fa-arrow-right {
            font-size: 0.85rem;
            color: #9ca3af;
            transition: transform 0.3s ease;
        }

        .link-item:hover .fa-arrow-right {
            transform: translateX(4px);
            color: #ffffff;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            text-align: center;
            color: #6b7280;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Intro Overlay -->
    <div id="intro-overlay">
        <div class="intro-content">
            <h1>YANZ</h1>
            <p>CLICK TO ENTER</p>
        </div>
    </div>

    <!-- Main Wrapper -->
    <div class="container" id="main-container">
        
        <!-- Navigation Menu -->
        <nav>
            <button class="tab-btn active" onclick="switchPage('home')">Home</button>
            <button class="tab-btn" onclick="switchPage('links')">Links</button>
        </nav>

        <!-- Content Area -->
        <div style="width: 100%;">
            <!-- Home Page -->
            <div id="home" class="page active">
                <div class="profile-card">
                    <div class="avatar-container">
                        <!-- Ganti link gambar di bawah jika ingin foto profil khusus -->
                        <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?q=80&w=300&auto=format&fit=crop" alt="Yanz" class="avatar">
                    </div>
                    <h2>Yanz</h2>
                    <p>Welcome to my personal space. Check out my links and social accounts below!</p>
                    <div class="status-badge">
                        <div class="status-dot"></div>
                        Ready to Connect
                    </div>
                </div>
            </div>

            <!-- Links Page -->
            <div id="links" class="page">
                <div class="links-container">
                    <a href="https://www.tiktok.com/@yanzaja114" target="_blank" class="link-item">
                        <div class="link-info">
                            <i class="fa-brands fa-tiktok"></i>
                            <span>TikTok (@yanzaja114)</span>
                        </div>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>

                    <a href="https://www.instagram.com/yanzaja114/" target="_blank" class="link-item">
                        <div class="link-info">
                            <i class="fa-brands fa-instagram"></i>
                            <span>Instagram (@yanzaja114)</span>
                        </div>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>

                    <a href="https://www.roblox.com" target="_blank" class="link-item">
                        <div class="link-info">
                            <i class="fa-solid fa-gamepad"></i>
                            <span>Roblox (yanzxa4)</span>
                        </div>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>

                    <div class="link-item" onclick="alert('Discord Username: yanzaja114')" style="cursor: pointer;">
                        <div class="link-info">
                            <i class="fa-brands fa-discord"></i>
                            <span>Discord (yanzaja114)</span>
                        </div>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            &copy; 2026 Yanz. All rights reserved.
        </div>
    </div>

    <script>
        // Intro Click Trigger
        const introOverlay = document.getElementById('intro-overlay');
        const mainContainer = document.getElementById('main-container');

        introOverlay.addEventListener('click', () => {
            introOverlay.style.opacity = '0';
            introOverlay.style.visibility = 'hidden';
            mainContainer.style.display = 'flex';
        });

        // Tab Switching Logic
        function switchPage(pageId) {
            const pages = document.querySelectorAll('.page');
            const buttons = document.querySelectorAll('.tab-btn');

            pages.forEach(page => page.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');
            
            // Activate corresponding button
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
