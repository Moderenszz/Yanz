<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanz - Profile</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #2e0854, #4a0e4e, #881337, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Intro Overlay (Auto masuk tanpa klik) */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #11071f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOutIntro 0.8s ease 1.8s forwards;
        }

        .intro-content {
            text-align: center;
            animation: pulseIntro 1.5s infinite alternate;
        }

        .intro-content h1 {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #c084fc, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .intro-content p {
            color: #d1d5db;
            font-size: 0.95rem;
            letter-spacing: 2px;
        }

        @keyframes pulseIntro {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes fadeOutIntro {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Canvas Partikel */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 998;
        }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        /* Navigation Header */
        nav {
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        nav button {
            background: transparent;
            border: none;
            color: #d1d5db;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        nav button.active, nav button:hover {
            background: linear-gradient(135deg, #9333ea, #ec4899);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
        }

        /* Pages */
        .page {
            display: none;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profile Card */
        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        /* PP Huruf Y */
        .avatar-letter {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #9333ea, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            border: 3px solid #f472b6;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
        }

        .profile-card h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .profile-card p {
            color: #d1d5db;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Links List */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .link-info i {
            font-size: 1.4rem;
            width: 25px;
            text-align: center;
        }

        .fa-tiktok { color: #fe2c55; }
        .fa-instagram { color: #e1306c; }
        .fa-gamepad { color: #ef4444; }
        .fa-discord { color: #5865F2; }

        .link-item span {
            font-size: 0.95rem;
        }

        .link-item .fa-arrow-right {
            font-size: 0.85rem;
            color: #9ca3af;
            transition: transform 0.3s ease;
        }

        .link-item:hover .fa-arrow-right {
            transform: translateX(4px);
            color: #ffffff;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            text-align: center;
            color: #9ca3af;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Intro Overlay (Auto Masuk) -->
    <div id="intro-overlay">
        <div class="intro-content">
            <h1>YANZ</h1>
            <p>LOADING PROFILE...</p>
        </div>
    </div>

    <!-- Canvas untuk Efek Partikel -->
    <canvas id="particle-canvas"></canvas>

    <!-- Audio Efek Shiny (Sintesis Suara via Web Audio API) -->

    <!-- Main Wrapper -->
    <div class="container" id="main-container">
        
        <!-- Navigation Menu -->
        <nav>
            <button class="tab-btn active" onclick="switchPage('home', event)">Home</button>
            <button class="tab-btn" onclick="switchPage('links', event)">Links</button>
        </nav>

        <!-- Content Area -->
        <div style="width: 100%;">
            <!-- Home Page -->
            <div id="home" class="page active">
                <div class="profile-card">
                    <div class="avatar-container">
                        <!-- PP Huruf Y -->
                        <div class="avatar-letter">Y</div>
                    </div>
                    <h2>Yanz</h2>
                    <p>Welcome to my personal space. Check out my links and social accounts below!</p>
                    <div class="status-badge">
                        <div class="status-dot"></div>
                        Ready to Connect
                    </div>
                </div>
            </div>

            <!-- Links Page -->
            <div id="links" class="page">
                <div class="links-container">
                    <a href="https://www.tiktok.com/@yanzaja114" target="_blank" class="link-item">
                        <div class="link-info">
                            <i class="fa-brands fa-tiktok"></i>
                            <span>TikTok (@yanzaja114)</span>
                        </div>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>

                    <a href="https://www.instagram.com/yanzaja114/" target="_blank" class="link-item">
                        <div class="link-info">
                            <i class="fa-brands fa-instagram"></i>
                            <span>Instagram (@yanzaja114)</span>
                        </div>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>

                    <a href="https://www.roblox.com" target="_blank" class="link-item">
                        <div class="link-info">
                            <i class="fa-solid fa-gamepad"></i>
                            <span>Roblox (yanzxa4)</span>
                        </div>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>

                    <div class="link-item" onclick="alert('Discord Username: yanzaja114')" style="cursor: pointer;">
                        <div class="link-info">
                            <i class="fa-brands fa-discord"></i>
                            <span>Discord (yanzaja114)</span>
                        </div>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            &copy; 2026 Yanz. All rights reserved.
        </footer>
    </div>

    <script>
        // Web Audio API untuk Efek Suara Shiny saat klik tombol
        function playShinySound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                // Efek nada naik (shiny chime)
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nada D5
                osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.3); // Nada E6

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        }

        // Efek Partikel Sederhana saat Tombol Diklik
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticles(x, y) {
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x: x,
                    y: y,
                    size: Math.random() * 5 + 2,
                    speedX: (Math.random() - 0.5) * 8,
                    speedY: (Math.random() - 0.5) * 8,
                    color: ['#f472b6', '#c084fc', '#ffffff', '#e879f9'][Math.floor(Math.random() * 4)],
                    life: 1
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.life -= 0.03;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                if (p.life <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Tab Switching Logic dengan efek suara dan partikel
        function switchPage(pageId, event) {
            playShinySound();
            
            const rect = event.target.getBoundingClientRect();
            createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

            const pages = document.querySelectorAll('.page');
            const buttons = document.querySelectorAll('.tab-btn');

            pages.forEach(page => page.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
